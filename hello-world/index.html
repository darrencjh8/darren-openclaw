<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1e293b, #0f172a 70%);
      color: #f8fafc;
    }
    .card {
      text-align: center;
      padding: 4rem 5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f472b6, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      margin-top: 1rem;
      color: #94a3b8;
      font-size: 1.1rem;
    }
    button {
      margin-top: 2rem;
      padding: 0.75rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      background: #f472b6;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    button:hover { transform: translateY(-2px); background: #fb7185; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, World!</h1>
    <p>Printed from a tiny HTML app 🌸</p>
    <button id="greet">Say it again</button>
  </main>
  <script>
    const btn = document.getElementById("greet");
    btn.addEventListener("click", () => {
      const h1 = document.querySelector("h1");
      h1.textContent = "Hello, World!";
      document.querySelector("p").textContent = "It still works ✨";
    });
  </script>
</body>
</html>
