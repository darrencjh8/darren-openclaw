services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    ports:
      - "18789:18789"
    volumes:
      - ./openclaw.json:/app/openclaw.json:ro
      - ./workspace/skills:/app/skills:ro
      - ./AGENTS.md.template:/app/AGENTS.md.template:ro
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - openclaw_home:/app/.openclaw
      - openclaw_data:/app/data
    user: node
    entrypoint: ["/app/docker-entrypoint.sh"]
    environment:
      - OPENCLAW_CONFIG_PATH=/app/openclaw.json
      - OPENCLAW_HOME=/app
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - USER_NAME=${USER_NAME:-there}
      - SYSTEM_PROMPT_EXTRA=${SYSTEM_PROMPT_EXTRA:-}
    restart: unless-stopped

  expense-tracker:
    build:
      context: ../modules/expense-tracker
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../modules/expense-tracker/data:/app/data
      - ../modules/expense-tracker/.env:/app/.env:ro
    environment:
      - ACTUAL_API_URL=http://actual-api:3000
    restart: unless-stopped

  actual-api:
    build:
      context: ./actual-api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ../modules/portfolio-tracker/.env
    restart: unless-stopped

  portfolio-tracker:
    build:
      context: ../modules/portfolio-tracker
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ../modules/portfolio-tracker/data:/app/data
      - onedrive_data:/data/onedrive:rw
    environment:
      - PP_XML_PATH=/app/data/Portfolio.portfolio
    env_file:
      - ../modules/portfolio-tracker/.env
    restart: unless-stopped
    depends_on:
      - onedrive-sync

  onedrive-sync:
    image: driveone/onedrive:latest
    volumes:
      - ../modules/onedrive-sync/config/onedrive:/onedrive/conf
      - ../modules/onedrive-sync/config/onedrive-state:/root/.config/onedrive
      - ../modules/onedrive-sync/config/sync_list:/onedrive/conf/sync_list:ro
      - onedrive_data:/root/OneDrive
    environment:
      - ONEDRIVE_SYNC_INTERVAL=300
    healthcheck:
      test: ["CMD", "pgrep", "onedrive"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  openclaw_data:
  openclaw_home:
  onedrive_data: