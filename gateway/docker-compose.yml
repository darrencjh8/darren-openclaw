services:
    openclaw:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "18789:18789"
            - "18800:18800"
        volumes:
            - ./openclaw.json:/app/openclaw.json.bk:ro
            - ./workspace/skills:/app/.openclaw/workspace/skills
            - ./AGENTS.md.template:/app/AGENTS.md.template:ro
            - ./AGENTS.thinker.md.template:/app/AGENTS.thinker.md.template:ro
            - ./SOUL.md.template:/app/SOUL.md.template:ro
            - ./USER.md.template:/app/USER.md.template:ro
            - ./IDENTITY.md.template:/app/IDENTITY.md.template:ro
            - ./MEMORY.md.template:/app/MEMORY.md.template:ro
            - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
            - ../modules/perchance-gen:/app/modules/perchance-gen:ro
            - ../modules/ktmb/skills:/home/node/skills/ktmb-booking:ro
            - openclaw_home:/app/.openclaw
            - openclaw_data:/app/data
        user: node
        entrypoint: ["/app/docker-entrypoint.sh"]
        env_file:
            - .env
            - ../modules/portfolio-tracker/.env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - OPENCLAW_HOME=/app
            - DISPLAY=:99
            - DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/dbus-session
            - NODE_COMPILE_CACHE=/app/.openclaw/compile-cache
            - OPENCLAW_NO_RESPAWN=1
            - CDP_URL=http://host.docker.internal:9223
            - TZ=Asia/Kuala_Lumpur
        restart: unless-stopped

    expense-tracker:
        build:
            context: ../modules/expense-tracker
            dockerfile: docker/Dockerfile
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - ../modules/expense-tracker/data:/app/data
            - ../modules/expense-tracker/.env:/app/.env:ro
        environment:
            - ACTUAL_API_URL=http://actual-api:3000
        restart: unless-stopped

    actual-api:
        build:
            context: ./actual-api
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:3000:3000"
        env_file:
            - ../modules/portfolio-tracker/.env
        restart: unless-stopped

    portfolio-tracker:
        build:
            context: ../modules/portfolio-tracker
            dockerfile: docker/Dockerfile
        ports:
            - "127.0.0.1:8081:8081"
        volumes:
            - ../modules/portfolio-tracker/data:/app/data
            - onedrive_data:/data/onedrive:rw
            - ../modules/onedrive-sync/config/onedrive/refresh_token:/app/config/onedrive_refresh_token:ro
            - ../modules/portfolio-tracker/config/google-service-account.json:/app/config/google-service-account.json:ro
        environment:
            - PP_XML_PATH=/data/onedrive/Portfolio/Portfolio.portfolio
        env_file:
            - ../modules/portfolio-tracker/.env
        restart: unless-stopped

    ktmb-booking:
        build:
            context: ../modules/ktmb
            dockerfile: docker/Dockerfile
        ports:
            - "127.0.0.1:8082:8082"
        volumes:
            - ../modules/ktmb/.env:/app/.env:ro
        environment:
            - KTMB_NOTIFY_URL=http://openclaw:18800/api/notify
        restart: unless-stopped

volumes:
    openclaw_data:
    openclaw_home:
    onedrive_data:
