# Default gitleaks config extended with PII rules
# Docs: https://github.com/gitleaks/gitleaks?tab=readme-ov-file#configuration

title = "gitleaks config"

# Allowlist — add known false positives here
[allowlist]
    description = "global allowlist"
    paths = [
        '''(^|/)package-lock\.json$''',
        '''(^|/)pnpm-lock\.yaml$''',
        '''(^|/)yarn\.lock$''',
    ]

# ---- Custom PII rules ----

[[rules]]
    id = "email-address"
    description = "PII: Email address"
    regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'''
    keywords = ["@"]
    [rules.allowlist]
        description = "ignore docs, changelogs, placeholders"
        paths = [
            '''(^|/)docs/''',
            '''(^|/)\.github/''',
            '''(^|/)CHANGELOG''',
        ]
        regexes = [
            '''example\.com''',
            '''your-email''',
            '''noreply''',
            '''test@''',
            '''@users\.noreply\.github\.com''',
        ]

[[rules]]
    id = "private-key-header"
    description = "PII: Private key header"
    regex = '''-----BEGIN\s(?:RSA|DSA|EC|OPENSSH|PGP)\sPRIVATE\sKEY-----'''
    keywords = ["BEGIN", "PRIVATE KEY"]

[[rules]]
    id = "openai-api-key"
    description = "OpenAI API key"
    regex = '''sk-[A-Za-z0-9]{32,}'''
    keywords = ["sk-"]

[[rules]]
    id = "slack-webhook"
    description = "Slack webhook URL"
    regex = '''https://hooks\.slack\.com/services/[A-Za-z0-9_/]+'''
    keywords = ["hooks.slack.com"]

[[rules]]
    id = "generic-api-key-assignment"
    description = "Generic API key / token assignment in config files"
    regex = '''(?i)(api[_-]?key|apikey|secret|token|password|passwd)\s*[:=]\s*['"][^'"]{8,}['"]'''
    keywords = ["api_key", "apikey", "secret", "token", "password", "passwd"]
    path = '''(?i)(\.env\.example|\.env\.template|\.sample)'''
    [rules.allowlist]
        description = "ignore example/sample files"
        paths = [
            '''(?i)\.env\.example$''',
            '''(?i)\.env\.template$''',
            '''(?i)\.sample$''',
            '''(?i)example''',
        ]
