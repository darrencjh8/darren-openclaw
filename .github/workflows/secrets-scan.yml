name: Secrets & PII Scan

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Run gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITLEAKS_CONFIG: .gitleaks.toml
