name: Secrets & PII Scan

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            scan_full_history:
                description: "Scan the entire git history (default: PR commits only)"
                type: boolean
                default: false

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Full history scan
              if: github.event_name == 'workflow_dispatch' && inputs.scan_full_history
              env:
                  GITLEAKS_VERSION: 8.24.3
              run: |
                  curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
                  gitleaks detect --source . --config .gitleaks.toml --verbose --redact

            # A pull request is gated on its tip tree, not its commit range: a range
            # scan keeps failing on a finding an earlier commit introduced and a later
            # one removed, so the PR could never go green without rewriting history
            # (#640). The tip scan still fails any PR whose files carry a leak, however
            # it entered; the push scan below keeps the range check on every branch.
            - name: PR tip scan
              if: github.event_name == 'pull_request'
              env:
                  GITLEAKS_VERSION: 8.24.3
              run: |
                  curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
                  tip="$(mktemp -d)"
                  git archive HEAD | tar -x -C "$tip"
                  gitleaks dir "$tip" --config .gitleaks.toml --verbose --redact

            - name: Push scan (default)
              if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.scan_full_history)
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
