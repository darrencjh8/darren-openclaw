name: Secrets & PII Scan

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            scan_full_history:
                description: "Scan the entire git history (default: PR commits only)"
                type: boolean
                default: false

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Full history scan
              if: github.event_name == 'workflow_dispatch' && inputs.scan_full_history
              env:
                  GITLEAKS_VERSION: 8.24.3
              run: |
                  curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
                  gitleaks detect --source . --config .gitleaks.toml --verbose --redact

            # A pull request is gated on its tip tree, not its commit range: a range
            # scan keeps failing on a finding an earlier commit introduced and a later
            # one removed, so the PR could never go green without rewriting history
            # (#640). The tip scan still fails any PR whose files carry a leak, however
            # it entered; the push scan below keeps the range check on every branch.
            - name: PR tip scan
              if: github.event_name == 'pull_request'
              env:
                  GITLEAKS_VERSION: 8.24.3
              run: |
                  curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
                  tip="$(mktemp -d)"
                  git archive HEAD | tar -x -C "$tip"
                  gitleaks dir "$tip" --config .gitleaks.toml --verbose --redact

            - name: Push scan (default)
              if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.scan_full_history)
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # gitleaks matches credential shapes; an account suffix or a holder's name is
    # not one, so it passes gitleaks. These gates catch the real PII literals the
    # #633 scrub removed (#635). The real values are never committed: they come
    # from the PII_PATTERNS_JSON repository secret. Until that secret is set the
    # job warns and skips rather than failing every build.
    pii-literals:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Load the PII pattern file
              id: patterns
              env:
                  PII_PATTERNS_JSON: ${{ secrets.PII_PATTERNS_JSON }}
              run: |
                  if [ -z "$PII_PATTERNS_JSON" ]; then
                      echo "::warning::PII_PATTERNS_JSON secret is not set; the PII literal gate is skipped"
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  printf '%s' "$PII_PATTERNS_JSON" > scripts/.pii-patterns.local.json
                  echo "ready=true" >> "$GITHUB_OUTPUT"
            - name: No real PII literals in tracked files
              if: steps.patterns.outputs.ready == 'true'
              run: python3 scripts/check-no-pii.py
            - name: Remap invariants hold
              if: steps.patterns.outputs.ready == 'true'
              run: python3 scripts/verify-remap-safety.py

    # Report mode (#635): flags new commits whose author email is not a GitHub
    # noreply address, as a warning, without failing the build. History is left
    # alone. Flip `exit 0` to `exit 1` to enforce once committers use noreply.
    author-email:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: New commits use a noreply author email
              env:
                  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
              run: |
                  if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
                      range="$HEAD_SHA^!"
                  else
                      range="$BASE..$HEAD_SHA"
                  fi
                  flagged=0
                  while IFS=' ' read -r sha email; do
                      # Split rather than match whole addresses, so this file holds
                      # no email-shaped literal for the email-address rule to flag.
                      domain="${email##*@}"
                      user="${email%@*}"
                      if [ "$domain" = "users.noreply.github.com" ]; then continue; fi
                      if [ "$user" = "noreply" ] && { [ "$domain" = "github.com" ] || [ "$domain" = "anthropic.com" ]; }; then continue; fi
                      echo "::warning::commit ${sha:0:12} has a non-noreply author email"
                      flagged=$((flagged + 1))
                  done < <(git log --format='%H %ae' "$range")
                  echo "author-email: $flagged commit(s) flagged (report mode)"
                  exit 0
