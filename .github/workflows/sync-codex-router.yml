name: Sync Codex Router

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  deploy-if-updated:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Compare router main with deployed revision
        id: router
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PAT }}
        run: |
          remote_sha="$(gh api repos/darrencjh8/codex-router/commits/main --jq .sha)"
          latest_run="$(gh run list --repo darrencjh8/darren-openclaw --workflow deploy.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          deployed_sha=""
          if [ -n "$latest_run" ]; then
            gh run download "$latest_run" --repo darrencjh8/darren-openclaw -n codex-router-sha -D /tmp/router-sha >/dev/null 2>&1 || true
            deployed_sha="$(cat /tmp/router-sha/codex-router-sha/codex-router-sha.txt 2>/dev/null || true)"
          fi
          echo "remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"
          if [ "$remote_sha" != "$deployed_sha" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch router-only deployment
        if: steps.router.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run deploy.yml --repo darrencjh8/darren-openclaw
          --ref main -f components=codex-router
