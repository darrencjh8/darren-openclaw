name: Deploy to Production

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch, tag, or commit SHA (default: main)"
                type: string
                default: "main"

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    test:
        uses: ./.github/workflows/test.yml
        secrets:
            ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

    deploy:
        needs: test
        runs-on: self-hosted
        environment: darren-prod
        env:
            DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}
        defaults:
            run:
                working-directory: /home/darren/workspace/hermes/darren-openclaw
        steps:
            - name: Deploy all services
              env:
                  HOME: /home/darren
                  # ── Hermes: LLM ──
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  # ── Hermes: Telegram ──
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
                  TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
                  # ── Hermes: Webhook ──
                  HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
                  # ── Hermes: GitHub App ──
                  MEMORY_REPO_URL: ${{ secrets.MEMORY_REPO_URL }}
                  GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
                  GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
                  GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
                  # ── Hermes: Dashboard Auth ──
                  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
                  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
                  # ── Hermes: Persona ──
                  IDENTITY_NAME: ${{ secrets.IDENTITY_NAME }}
                  IDENTITY_EMOJI: ${{ secrets.IDENTITY_EMOJI }}
                  IDENTITY_VIBE: ${{ secrets.IDENTITY_VIBE }}
                  SOUL_VOICE_TONE: ${{ secrets.SOUL_VOICE_TONE }}
                  SOUL_VOICE_STYLE: ${{ secrets.SOUL_VOICE_STYLE }}
                  SOUL_VOICE_RULES: ${{ secrets.SOUL_VOICE_RULES }}
                  SOUL_DELEGATION: ${{ secrets.SOUL_DELEGATION }}
                  # ── Hermes: Optional (create these secrets or remove lines) ──
                  # ── Actual Budget ──
                  ACTUAL_BUDGET_URL: ${{ secrets.ACTUAL_BUDGET_URL }}
                  ACTUAL_BUDGET_PASSWORD: ${{ secrets.ACTUAL_BUDGET_PASSWORD }}
                  ACTUAL_PRIMARY_BUDGET_FILE: ${{ secrets.ACTUAL_PRIMARY_BUDGET_FILE }}
                  ACTUAL_SECONDARY_BUDGET_FILE: ${{ secrets.ACTUAL_SECONDARY_BUDGET_FILE }}
                  ACTUAL_PRIMARY_CURRENCY: ${{ secrets.ACTUAL_PRIMARY_CURRENCY }}
                  ACTUAL_SECONDARY_CURRENCY: ${{ secrets.ACTUAL_SECONDARY_CURRENCY }}
                  # ── Expense Tracker ──
                  NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
                  IMAP_HOST: ${{ secrets.IMAP_HOST }}
                  IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
                  IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
                  # ── Portfolio Tracker ──
                  ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
                  IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
                  IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
                  IBKR_PP_SGD_ACCOUNT: ${{ secrets.IBKR_PP_SGD_ACCOUNT }}
                  IBKR_PP_USD_ACCOUNT: ${{ secrets.IBKR_PP_USD_ACCOUNT }}
                  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
                  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
              run: |
                  set -euo pipefail
                  git config --local http.https://github.com/.extraheader "AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}"
                  git fetch origin
                  git checkout "$DEPLOY_REF"
                  if git show-ref --verify "refs/heads/$DEPLOY_REF" 2>/dev/null; then
                      git pull origin "$DEPLOY_REF"
                  fi
                  bash ./modules/deploy.sh --component all --non-interactive
                  git config --local --unset http.https://github.com/.extraheader
