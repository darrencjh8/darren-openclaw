name: Unit Tests

on:
    pull_request:
        branches: [main]
    workflow_call:
        secrets:
            ONEDRIVE_CLIENT_ID:
            SUBMODULE_PAT:

jobs:
    expense-tracker:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: modules/expense-tracker
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
            - run: npm ci
            - run: npm test

    portfolio-tracker:
        runs-on: ubuntu-latest
        continue-on-error: true # needs IBKR keys + running services, fixing separately
        defaults:
            run:
                working-directory: modules/portfolio-tracker
        env:
            ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci
            - run: npm test

    pp-cli:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: modules/portfolio-tracker/pp-cli
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: temurin
            - name: Install PP model to local Maven repo
              run: |
                  mvn install:install-file -q -Dfile=lib/name.abuchen.portfolio-0.84.1.jar \
                    -DpomFile=lib/name.abuchen.portfolio-0.84.1.pom \
                    -DgroupId=name.abuchen.portfolio -DartifactId=name.abuchen.portfolio \
                    -Dversion=0.84.1 -Dpackaging=jar
            - name: Run Java tests
              run: mvn test

    hermes-scripts:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Lint bash scripts
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
                  shellcheck modules/hermes/scripts/*.sh modules/hermes/50-seed-defaults
            - name: Test github-auth.sh
              run: bash modules/hermes/tests/test-github-auth.sh
            - name: Test 50-seed-defaults cron jobs
              run: bash modules/hermes/tests/test-50-seed-defaults.sh
            - name: Test deploy.sh logic
              run: bash modules/hermes/tests/test-deploy.sh

    ktmb:
        runs-on: ubuntu-latest
        env:
            SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        steps:
            - uses: actions/checkout@v4
            - name: Clone ktmb submodule
              id: submodule
              run: |
                  if [ -z "${SUBMODULE_PAT}" ]; then
                    echo "::error::SUBMODULE_PAT secret is not set — add it in repo Settings > Secrets and variables > Actions"
                    exit 1
                  fi
                  # Unset GITHUB_TOKEN extraheader (checkout@v4 sets it on local config)
                  # to avoid auth conflict with the PAT used below
                  git config --local --unset-all http.https://github.com/.extraheader || true
                  git -c url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf="https://github.com/" submodule update --init modules/ktmb
                  echo "available=true" >> "$GITHUB_OUTPUT"
            - uses: actions/setup-python@v5
              if: steps.submodule.outputs.available == 'true'
              with:
                  python-version: "3.12"
            - name: Run ktmb tests
              if: steps.submodule.outputs.available == 'true'
              working-directory: modules/ktmb
              run: |
                  set -x
                  pip install -r requirements.txt
                  pytest tests/ -v --no-header --tb=long -x

    image-gen:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Install deps
              working-directory: modules/image-gen
              run: npm ci
            - name: Run tests
              working-directory: modules/image-gen
              run: node --test __tests__/server.test.js
