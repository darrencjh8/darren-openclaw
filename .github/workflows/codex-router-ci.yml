name: Codex Router CI

on:
    workflow_dispatch:
        inputs:
            router_ref:
                description: "Private Codex Router branch, tag, or commit SHA"
                required: true
                default: main
                type: string
    repository_dispatch:
        types: [codex-router-ci]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        environment: darren-prod
        steps:
            - name: Check out private Codex Router
              uses: actions/checkout@v4
              with:
                  repository: darrencjh8/codex-router
                  ref: ${{ github.event.inputs.router_ref || github.event.client_payload.router_ref || 'main' }}
                  token: ${{ secrets.SUBMODULE_PAT }}
                  persist-credentials: false
                  path: codex-router

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              working-directory: codex-router
              run: python -m pip install --requirement requirements.txt

            - name: Run unit and regression tests
              working-directory: codex-router
              run: python -m unittest discover -s tests -p "test_*.py"

            - name: Validate Docker contract
              working-directory: codex-router
              run: bash tests/test_docker.sh

            - name: Smoke-test auto-thinking external providers
              working-directory: codex-router
              env:
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
                  OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
              run: |
                  test -n "$OPENCODE_API_KEY"
                  test -n "$OPENCODE_ZEN_API_KEY"
                  test -n "$DEEPSEEK_API_KEY"
                  python tests/test_provider_smoke_live.py

            - name: Validate GLM OpenCode Go contract
              working-directory: codex-router
              env:
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
              run: |
                  test -n "$OPENCODE_API_KEY"
                  python tests/test_opencode_glm_live.py

            - name: Upload GLM latency measurements
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: glm-opencode-latency
                   path: codex-router/glm-opencode-latency.json
                   if-no-files-found: warn
