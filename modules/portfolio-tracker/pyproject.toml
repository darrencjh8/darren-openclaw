[project]
name = "portfolio-tracker"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "pytesseract>=0.3",
    "pdf2image>=1.16",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "aioimaplib>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "live: marks tests requiring live services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
