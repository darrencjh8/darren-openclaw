services:
    kokoro-tts:
        image: remsky/kokoro-fastapi:latest
        container_name: kokoro-tts
        ports:
            - "127.0.0.1:8880:8880"
        volumes:
            - kokoro_models:/app/models
        environment:
            - PYTHONUNBUFFERED=1
        deploy:
            resources:
                limits:
                    memory: 1g
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -sf http://localhost:8880/health || exit 1",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

volumes:
    kokoro_models:
