x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    signal-cli:
        image: ghcr.io/asamk/signal-cli:latest
        container_name: signal-cli
        restart: unless-stopped
        command: daemon --http 0.0.0.0:8080
        volumes:
            - /home/runner/data/signal-cli:/home/signal-cli/.local/share/signal-cli
        ports:
            - "127.0.0.1:8084:8080"
        networks:
            - hermes_shared
        logging: *default-logging

networks:
    hermes_shared:
        external: true
