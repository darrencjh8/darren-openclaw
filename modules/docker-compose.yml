services:
    openclaw:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "0.0.0.0:18789:18789"
            - "0.0.0.0:18800:18800"
        volumes:
            - ./openclaw.json:/app/openclaw.json.bk:ro
            - ./exec-approvals.json:/app/exec-approvals.json:ro
            - ./workspace/skills:/home/node/.openclaw/workspace/skills:ro
            - ./AGENTS.md.template:/app/AGENTS.md.template:ro
            - ./AGENTS.thinker.md.template:/app/AGENTS.thinker.md.template:ro
            - ./SOUL.md.template:/app/SOUL.md.template:ro
            - ./USER.md.template:/app/USER.md.template:ro
            - ./IDENTITY.md.template:/app/IDENTITY.md.template:ro
            - ./MEMORY.md.template:/app/MEMORY.md.template:ro
            - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
            - ../modules/perchance-gen:/app/modules/perchance-gen:ro
            - ../modules/ktmb/skills:/home/node/skills/ktmb-booking:ro
            - ./plugins/expense-tracker-tools:/home/node/plugins/expense-tracker-tools:ro
            - openclaw_home:/app/.openclaw
            - openclaw_data:/app/data
            - image_gen_media:/app/.openclaw/workspace/media
        user: node
        entrypoint: ["/app/docker-entrypoint.sh"]
        env_file:
            - .env
            - ../modules/portfolio-tracker/.env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - OPENCLAW_HOME=/app
            - DISPLAY=:99
            - DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/dbus-session
            - NODE_COMPILE_CACHE=/app/.openclaw/compile-cache
            - OPENCLAW_NO_RESPAWN=1
            - CDP_URL=http://172.17.0.1:9223
            - TZ=Asia/Kuala_Lumpur
            - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
            - OPENCLAW_GATEWAY_URL=http://127.0.0.1:18789
            - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
        restart: unless-stopped

    expense-tracker:
        build:
            context: ../modules/expense-tracker
            dockerfile: docker/Dockerfile
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - ../modules/expense-tracker/data:/app/data
            - ../modules/expense-tracker/.env:/app/.env:ro
        environment:
            - ACTUAL_API_URL=http://actual-api:3000
            - NOTIFY_URL=http://hermes:8644/webhooks/expense
            - HERMES_WEBHOOK_SECRET=${HERMES_WEBHOOK_SECRET}
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'node -e ''require("http").get("http://localhost:8080/health",function(r){process.exit(r.statusCode===200?0:1)})''',
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 20s

    actual-api:
        build:
            context: ../modules/actual-api
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:3000:3000"
        env_file:
            - ../modules/portfolio-tracker/.env
        environment:
            - BUDGET_SWITCH_DELAY_MS=5000
        restart: unless-stopped

    portfolio-tracker:
        build:
            context: ../modules/portfolio-tracker
            dockerfile: docker/Dockerfile
        ports:
            - "127.0.0.1:8081:8081"
        volumes:
            - ../modules/portfolio-tracker/data:/app/data
            - onedrive_data:/data/onedrive:rw
            - ../modules/onedrive-sync/config/onedrive/refresh_token:/app/config/onedrive_refresh_token:rw
            - ../modules/portfolio-tracker/config/google-service-account.json:/app/config/google-service-account.json:ro
        environment:
            - PP_XML_PATH=/data/onedrive/Portfolio/Portfolio.portfolio
        env_file:
            - ../modules/portfolio-tracker/.env
        restart: unless-stopped

    image-gen:
        build:
            context: ../modules/image-gen
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:8083:8083"
        volumes:
            - ../gateway/workspace/skills/image-generation:/app/scripts:ro
            - ../modules/perchance-gen:/app/modules/perchance-gen:ro
            - image_gen_media:/app/.openclaw/workspace/media
        env_file:
            - ../modules/portfolio-tracker/.env
            - ../modules/image-gen/.env
        environment:
            - CDP_URL=http://172.17.0.1:9223
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped

    ktmb-booking:
        build:
            context: ../modules/ktmb
            dockerfile: docker/Dockerfile
        ports:
            - "127.0.0.1:8082:8082"
        volumes:
            - ../modules/ktmb/.env:/app/.env
            - ../modules/ktmb/data:/app/data
        environment:
            - KTMB_DB_PATH=/app/data/ktmb_jobs.db
            - KTMB_NOTIFY_URL=http://openclaw:18789/api/notify
        restart: unless-stopped

    hermes:
        build:
            context: ../modules/hermes
            dockerfile: Dockerfile
        container_name: hermes
        restart: unless-stopped
        command: gateway run
        depends_on:
            expense-tracker:
                condition: service_healthy
                restart: true
        ports:
            - "8642:8642"
            - "9119:9119"
            - "8644:8644"
        volumes:
            - ~/.hermes:/opt/data
            - ~/workspace:/workspace
            - ../modules/expense-tracker/data:/opt/data/expense-tracker-data:ro
        env_file:
            - ../modules/hermes/.env
        environment:
            - HERMES_DASHBOARD=1
        shm_size: 1g

volumes:
    openclaw_data:
    openclaw_home:
    onedrive_data:
    image_gen_media:
