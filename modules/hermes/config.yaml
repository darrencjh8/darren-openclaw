providers:
    codex-router:
        name: Codex Router
        api: http://codex-router:4100/v1
        api_key: local
        transport: chat_completions
        default_model: gpt-5.6-terra

model:
    provider: custom:codex-router
    default: gpt-5.6-terra

compression:
    enabled: true
    threshold: 0.50
    threshold_tokens: 150000
    tail_mode: lean
    protect_last_n: 20
    in_place: true
    idle_compact_after_seconds: 3600
    proactive_prune_tokens: 48000

agent:
    reasoning_effort: medium
    disabled_toolsets:
        - image_gen
        - moa

display:
    show_reasoning: false

fallback_providers:
    - provider: opencode-go
      model: glm-5.2
    - provider: opencode-zen
      model: opencode/mimo-v2.5-free
      base_url: https://opencode.ai/zen/v1
    - provider: deepseek
      model: deepseek-v4-flash

delegation:
    max_spawn_depth: 1
    max_iterations: 100
    provider: custom:codex-router
    model: gpt-5.6-luna

approvals:
    mode: smart
    timeout: 60
    cron_mode: allow

memory:
    memory_enabled: true
    user_profile_enabled: true
    write_approval: true

skills:
    guard_agent_created: true

terminal:
    backend: local
    persistent_shell: true
    cwd: /workspace

web:
    search_backend: brave-free
    extract_backend: firecrawl

auxiliary:
    vision:
        provider: custom:codex-router
        model: gpt-5.6-terra
        fallback_chain:
            - provider: opencode-go
              model: glm-5.2
            - provider: deepseek
              model: deepseek-v4-flash-vision-exp
    web_extract:
        provider: custom:codex-router
        model: gpt-5.6-luna
        fallback_chain:
            - provider: opencode-go
              model: glm-5.2
            - provider: deepseek
              model: deepseek-v4-flash
    compression:
        provider: custom:codex-router
        model: gpt-5.6-luna
        fallback_chain:
            - provider: opencode-go
              model: glm-5.2
            - provider: deepseek
              model: deepseek-v4-flash
    approval:
        provider: custom:codex-router
        model: gpt-5.6-terra
        fallback_chain:
            - provider: opencode-go
              model: glm-5.2
            - provider: deepseek
              model: deepseek-v4-flash
    kanban_decomposer:
        provider: deepseek
        model: deepseek-v4-flash
    triage_specifier:
        provider: custom:codex-router
        model: gpt-5.6-luna
        fallback_chain:
            - provider: opencode-go
              model: glm-5.2
            - provider: deepseek
              model: deepseek-v4-flash
    profile_describer:
        provider: custom:codex-router
        model: gpt-5.6-luna
        fallback_chain:
            - provider: opencode-go
              model: glm-5.2
            - provider: deepseek
              model: deepseek-v4-flash

kanban:
    dispatch_in_gateway: true
    dispatch_interval_seconds: 60
    auto_decompose: true
    auto_decompose_per_tick: 3
    auto_promote_children: true
    failure_limit: 2
    max_in_progress: 4
    max_in_progress_per_profile: 2
    orchestrator_profile: project-manager
    default_assignee: code-reviewer

timezone: Asia/Kuala_Lumpur

tts:
    provider: "openai"
    openai:
        model: "kokoro"
        voice: "af_bella"
        speed: 1.0
        base_url: "http://kokoro-tts:8880/v1"
        response_format: "opus"

mcp_servers:
    expense-tracker:
        url: http://expense-tracker:8080/mcp
        tools:
            exclude: []
        supports_parallel_tool_calls: false
    portfolio-tracker:
        url: http://portfolio-tracker:8081/mcp
        tools:
            exclude: []
        supports_parallel_tool_calls: false
    ktmb-booking:
        url: http://ktmb-booking:8082/mcp
        tools:
            exclude:
                - ktmb_reset_password
        supports_parallel_tool_calls: false
    image-gen:
        url: http://image-gen:8083/mcp
        supports_parallel_tool_calls: false

platforms:
    webhook:
        enabled: true
        extra:
            port: 8644
            secret: ${HERMES_WEBHOOK_SECRET}
            routes:
                notify:
                    secret: ${HERMES_WEBHOOK_SECRET}
                    prompt: |
                        ⚠️ System push alert from a monitoring service or module.
                        You are relaying an automated notification — do NOT call any tools or skills.
                        Relay this to the user conversationally with personalization.
                        Do NOT acknowledge receipt, say "noted", "got it", or treat this as
                        a user command — this is an automated push from the system.
                        For single transaction notifications (one item), relay concisely as-is —
                        do NOT wrap in a table. Only use tables when relaying multi-item data.
                        Message: {message}
                    deliver: telegram
                    deliver_extra:
                        chat_id: "${TELEGRAM_HOME_CHANNEL}"

quick_commands:
    portfolio-sync:
        type: exec
        command: >-
            curl -s -X POST http://portfolio-tracker:8081/tools/pp-sync-all
            -H "Content-Type: application/json" -d '{}' --max-time 60
    portfolio-status:
        type: exec
        command: >-
            curl -s -X POST http://portfolio-tracker:8081/tools/pp-status -H "Content-Type: application/json" -d '{}'
